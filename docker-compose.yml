services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
    # No container_name: a fixed name forces the old container to stop before
    # the new one starts, so every deploy leaves a window of 502s. Production
    # should use Coolify's Dockerfile build pack, which rolls over on the
    # Dockerfile HEALTHCHECK; compose deployments never roll.
    restart: unless-stopped
    # Not published to the host. A fixed host port collides with whatever already
    # holds it on the deployment server, and Coolify's proxy reaches the container
    # over the internal network anyway. For docker compose up on a laptop,
    # docker-compose.override.yml publishes 3000 and is picked up automatically.
    expose:
      - "3000"
    # All optional. Without Supabase the app runs fully client-side and simply
    # does not persist or share reports.
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-}
      - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      # Runtime-only environment variables (never build args, never NEXT_PUBLIC_)
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - CRON_SECRET=${CRON_SECRET:-}
      - CLIENT_HASH_SALT=${CLIENT_HASH_SALT:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SIGNUP_NOTIFY_TO=${SIGNUP_NOTIFY_TO:-}
